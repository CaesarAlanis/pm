[project]
name = "pm-backend"
version = "0.1.0"
description = "Backend for the PM Kanban MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.23.0",
  "aiofiles>=23.2.1",
  "httpx>=0.28.1",
  "python-dotenv>=1.1.1",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
