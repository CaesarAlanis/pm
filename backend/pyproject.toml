[project]
name = "pm-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.12.1",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
    "pytest-cov>=6.2",
    "pytest-asyncio>=0.24",
]
